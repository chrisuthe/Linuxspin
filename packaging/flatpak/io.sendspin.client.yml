# Sendspin Player — Flatpak manifest
#
# This is the ONLY Flatpak manifest in the repository. CI builds this file rather than generating
# its own copy inline, which is what previously let two manifests drift with only the invisible
# one ever being built.
#
# Build locally:
#   dotnet publish src/Sendspin.Player/Sendspin.Player.csproj -c Release \
#     -f net10.0 -r linux-x64 --self-contained -o publish/linux-x64
#   flatpak-builder --user --force-clean --repo=repo build-dir \
#     packaging/flatpak/io.sendspin.client.yml
#   flatpak build-bundle repo Sendspin-Player.flatpak io.sendspin.client
app-id: io.sendspin.client

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: Sendspin.Player

finish-args:
  - --share=ipc
  - --share=network
  - --device=dri

  # Wayland is the backend the app defaults to, so --socket=wayland is what it normally uses.
  # X11 rather than fallback-x11, which is what this used to grant: fallback-x11 hands over the
  # X11 socket only when the wayland one is unavailable, so on a Wayland host it grants nothing
  # and SENDSPIN_X11=1 would have no X server to reach. That flag exists for the user whose
  # compositor the experimental Wayland backend misbehaves on — exactly the user who is inside
  # a Wayland session — so an escape hatch that only works where it is not needed is no hatch.
  # The cost is the X11 socket being held open on hosts that never use it.
  - --socket=wayland
  - --socket=x11

  # PipeWire's own socket rather than --socket=pulseaudio. The pulseaudio socket forces
  # enable-shm=no, which pushes every audio buffer through the socket instead of shared
  # memory — measurable overhead on a path that has a ±1 ms sync budget. This is a community
  # convention (the qpwgraph precedent) rather than a documented portal, so expect a Flathub
  # reviewer to ask about it.
  - --filesystem=xdg-run/pipewire-0

  # ...but on its own that grant is silence, which is why --socket=pulseaudio is here too.
  # Measured against this runtime rather than assumed: org.freedesktop.Platform 25.08 ships
  # OpenAL Soft 1.24.3 built with the pulse backend only. It has no "PipeWire Output" device
  # and dlopens libpulse.so.0 and nothing else — unlike the host's own 1.24.2, which does carry
  # the PipeWire backend. So nothing in the sandbox can speak the raw protocol the socket above
  # exposes, and OpenAL falls through to the null backend.
  #
  # The reasoning above is kept, not deleted: it is still the right preference, and the
  # PipeWire grant is retained for the day the runtime's OpenAL is built with that backend (or
  # the app bundles one that is), at which point OpenAL picks PipeWire ahead of pulse on its own
  # and the shm cost disappears without another manifest change. Building openal-soft as a
  # manifest module with -DALSOFT_BACKEND_PIPEWIRE=ON is the other way to get there; it is not
  # worth carrying a source build of the audio stack for a cost that is bounded by
  # pipewire-pulse, which is what actually serves this socket.
  - --socket=pulseaudio

  # Notifications and the StatusNotifierItem tray host. The tray name is org.kde.* even on
  # GNOME, where it is served by the AppIndicator extension rather than the shell.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

  # Deliberately NOT declared: --own-name=org.mpris.MediaPlayer2.*
  # Flatpak auto-grants org.mpris.MediaPlayer2.<app_id>.* and declaring it is a Flathub linter
  # error. The bus name the app claims is org.mpris.MediaPlayer2.io.sendspin.client, which falls
  # inside the automatic grant, so MPRIS works without any declaration here.

modules:
  - name: sendspin-player
    buildsystem: simple

    build-commands:
      - mkdir -p /app/bin
      - cp -r app-files/* /app/bin/
      - chmod +x /app/bin/Sendspin.Player

      - install -Dm644 io.sendspin.client.desktop
          /app/share/applications/io.sendspin.client.desktop
      - install -Dm644 io.sendspin.client.appdata.xml
          /app/share/metainfo/io.sendspin.client.appdata.xml
      - install -Dm644 sendspin-256.png
          /app/share/icons/hicolor/256x256/apps/io.sendspin.client.png

    sources:
      - type: dir
        path: ../../publish/linux-x64
        dest: app-files

      - type: file
        path: io.sendspin.client.desktop

      - type: file
        path: io.sendspin.client.appdata.xml

      - type: file
        path: sendspin-256.png
